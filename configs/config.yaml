project:
  name: "face_bmi_project"
  seed: 42

paths:
  raw_csv: "data/raw/data.csv"
  raw_images_dir: "data/raw/Images"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  models_dir: "models"
  metrics_dir: "outputs/metrics"
  plots_dir: "outputs/plots"

data:
  image_col: "name"
  bmi_col: "bmi"
  gender_col: "gender"
  split_col: "is_training"
  image_size: 224
  valid_extensions: [".jpg", ".jpeg", ".png", ".bmp"]
  gender_map:
    Female: 0
    Male: 1

training:
  device: "auto"
  num_workers: 0

  vgg16_baseline:
    batch_size: 32
    epochs: 20
    learning_rate: 0.0001
    weight_decay: 0.0001

  resnet50_multitask:
    batch_size: 16
    epochs: 35
    learning_rate: 0.00003
    weight_decay: 0.0001

  efficientnet_finetune:
    batch_size: 16
    epochs: 35
    learning_rate: 0.00002
    weight_decay: 0.00005

  resnet50_bmi_only:
    batch_size: 16
    epochs: 30
    learning_rate: 0.00003
    weight_decay: 0.00005

models:
  m1:
    name: "vgg16_imagenet_dense"
    backbone: "vgg16"
    frozen: true
    head_hidden_units: [256, 64]
    dropout: 0.30

  m2:
    name: "resnet50_multitask"
    backbone: "resnet50"
    frozen: true
    fine_tune_last_block: true
    bmi_loss_weight: 1.0
    gender_loss_weight: 0.10
    head_hidden_units: [512, 128]
    dropout: 0.25

  m3:
    name: "efficientnet_finetune"
    backbone: "efficientnet_b0"
    frozen: false
    unfreeze_last_n_blocks: 3
    head_hidden_units: [256, 64]
    dropout: 0.30
    
  resnet50_bmi_only:
    name: "resnet50_bmi_only"
    backbone: "resnet50"
    frozen: true
    fine_tune_last_block: true
    head_hidden_units: [256, 64]
    dropout: 0.20

m2:
  # Data
  csv_path: "data/raw/data.csv"
  img_dir:  "data/raw/Images"
  batch_size: 32
  img_size: 224
  num_workers: 4
  use_stratified_sampler: true

  # Training phases
  epochs_phase1: 10
  epochs_phase2: 35
  epochs_phase3: 15

  # Learning rates
  lr_backbone:  0.000005
  lr_head:      0.0003
  weight_decay: 0.0001

  # Loss
  huber_delta: 5.0
  use_uncertainty_weighting: true

  # Regularisation
  dropout_shared: 0.30
  dropout_bmi:    0.40
  dropout_gender: 0.30
  label_noise_std: 0.5
  mixup_prob: 0.5
  clip_grad: 1.0

  # Output
  save_dir: "reports/m2"